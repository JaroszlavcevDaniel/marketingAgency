<div class="mt-5 pt-5 position-relative overflow-hidden cormorant-garamond" [class.animate-cards]="cardsVisible"   #featureSection>
  <!-- Háttér díszítő elemek a kreatív atmoszféráért -->


  <div class="mt-5 pt-5 container position-relative z-1">
    
    <!-- Fejléc -->
    <div class="row mb-1 text-center">
 
    </div>


    <div class="row g-3 justify-content-center px-2">
      <div *ngFor="let service of services; let i = index" class="col-xl-2 col-md-12 card-perspective" [style.--card-index]="i" >
        
        <!-- 3D Kártya konténer -->
        <div class="card-inner" 
             [class.is-flipped]="isFlipped(service.id)"
             (click)="toggleCard(service.id)">
          
          <!-- ELŐLAP: Sötétkék-Lilás Gradiens -->
       <div class="card-front d-flex flex-column p-0 overflow-hidden" style="height: 100%;">
  
  <!-- Kép a felső részen (75% magasság) -->
  <img class="w-100" [src]="service.picture" alt="{{ service.title }}" style="height: 65%; object-fit: cover;">

  <!-- Szöveges tartalom az alsó részen (maradék 25%) -->
  <div class="card-body-content d-flex flex-column justify-content-between p-3 flex-grow-1">
    <div class="front-content">
      <!-- Cím -->
      <h5 class="h5 text-white mb-1 card-heading text-uppercase">{{ service.title }}</h5>
      <!-- Rövid leírás -->
      <p class="text-light-50 mb-3">{{ service.shortDescription }}</p>
    </div>
    
    <!-- Interakciós felirat -->
    <div class="action-hint d-flex align-items-center justify-content-between text-violet">
      <!-- <span class="small fw-semibold">☝</span> -->
      <i class="bi bi-arrow-right-circle-fill fs-6 animate-arrow"></i>
    </div>
  </div>

</div>

          <!-- HÁTLAP: Élénk Lila-Pink Gradiens (Kattintás után) -->
          <div class="card-back d-flex flex-column justify-content-between p-1 p-lg-1">
            <div class="back-content">
              <!-- Back Fejléc -->
              <div class="d-flex align-items-center mb-4">
                <div class="mini-icon-wrapper me-1">
                  <i [class]="service.icon"></i>
                </div>
                <h6 class="h6 fw-bold text-white m-0">{{ service.title }}</h6>
              </div>
              
              <p class="small text-white-75 mb-1">{{ service.longDescription }}</p>
              
              <!-- Al-szolgáltatások listája -->
              <ul class="sub-services-list list-unstyled m-0">
                <li *ngFor="let sub of service.subServices" 
                    [class.highlight-item]="sub.highlighted" 
                    class="d-flex align-items-center text-white mb-2 py-1 px-2 rounded">
                  <i class="bi bi-patch-check-fill me-1 text-magenta"></i>
                  <span class="small fw-medium">{{ sub.name }}</span>
                </li>
              </ul>
            </div>
            
            <!-- Vissza gomb / záró rész -->
            <div class="action-hint d-flex align-items-center justify-content-between text-white-50 mt-4">
              <span class="small fw-semibold">Kattints a bezáráshoz</span>
              <i class="bi bi-arrow-left-circle fs-4"></i>
            </div>
          </div>

        </div>

      </div>
    </div>

  </div>
</div>
