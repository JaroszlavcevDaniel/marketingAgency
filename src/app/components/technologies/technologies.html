<div class="tools-grid ">



    <button type="button" class="tool " *ngFor="let tool of tools" (click)="selectedTool = tool">

        <img [src]="tool.icon" [alt]="tool.name">
        <span class="text-warning cormorant-garamond fs-5">{{ tool.name }}</span>

    </button>

</div>

<!-- Popup -->

<div class="popup-backdrop" *ngIf="selectedTool" (click)="selectedTool = null">

    <div class="popup" (click)="$event.stopPropagation()">

        <button class="btn-close float-end btn-close-white" (click)="selectedTool = null">
        </button>

        <h5 class="text-light fw-bold cormorant-garamond fs-4">{{ selectedTool.name }}</h5>

        <p class="text-light cormorant-garamond text-justify fs-5">{{ selectedTool.description | space }}</p>

    </div>

</div>
