    <button
        type="button"
        class="tool"
        *ngIf="hero?.techOneNameHu || hero?.techOneNameEn"
        (click)="selectTool({
            icon: hero?.techOneIcon,
            name: currentLang === 'hu'
                ? hero?.techOneNameHu
                : hero?.techOneNameEn,
            description: currentLang === 'hu'
                ? hero?.techOneDescriptionHu
                : hero?.techOneDescriptionEn
        })"
    >

        <img
            [src]="hero?.techOneIcon"
            [alt]="currentLang === 'hu'
                ? hero?.techOneNameHu
                : hero?.techOneNameEn"
        >

        <span class="text-warning cormorant-garamond fs-5 fw-bold text-shadow">
            {{
                currentLang === 'hu'
                    ? hero?.techOneNameHu
                    : hero?.techOneNameEn
            }}
        </span>

    </button>

<!-- ========================= -->
<!-- POPUP -->
<!-- ========================= -->

<div
    class="popup-backdrop"
    *ngIf="selectedTool"
    (click)="closePopup()"
>

    <div
        class="popup"
        (click)="$event.stopPropagation()"
    >

        <button
            class="btn-close float-end btn-close-white"
            (click)="closePopup()"
        >
        </button>

        <h5 class="text-light fw-bold cormorant-garamond fs-4">
            {{ selectedTool.name }}
        </h5>

        <p class="text-light cormorant-garamond text-justify fs-5">
            {{ selectedTool.description | space }}
        </p>

    </div>

</div>
